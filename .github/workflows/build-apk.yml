name: Compila AA Browser (APK debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Installa Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepara Android SDK
        uses: android-actions/setup-android@v4

      - name: Installa Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compila APK di debug firmato
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Carica l'APK compilato
        uses: actions/upload-artifact@v4
        with:
          name: AA-Browser-In-Motion-debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/renamedApks/debug/*.apk
          if-no-files-found: error
          retention-days: 7
